<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Management System</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Animated Background -->
    <div class="background">
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <span class="logo-icon">📚</span>
                <h1>BookVault</h1>
            </div>
            <div class="header-stats">
                <div class="stat-badge">
                    <span class="stat-number" id="totalBooks">0</span>
                    <span class="stat-label">Books</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="content-grid">
            <!-- Add Book Glass Card -->
            <div class="glass-card add-book-card">
                <div class="card-glow"></div>
                <h2 class="card-title">
                    <span class="title-icon">✨</span>
                    Add New Book
                </h2>
                
                <form id="addBookForm" class="glass-form">
                    <div class="form-group">
                        <label for="title">📖 Book Title</label>
                        <input 
                            type="text" 
                            id="title" 
                            name="title" 
                            placeholder="Enter book title"
                            required 
                            class="glass-input">
                    </div>
                    
                    <div class="form-group">
                        <label for="author">✍️ Author</label>
                        <input 
                            type="text" 
                            id="author" 
                            name="author" 
                            placeholder="Enter author name"
                            required 
                            class="glass-input">
                    </div>
                    
                    <div class="form-group">
                        <label for="price">💰 Price</label>
                        <input 
                            type="number" 
                            id="price" 
                            name="price" 
                            step="0.01" 
                            min="0" 
                            placeholder="0.00"
                            required 
                            class="glass-input">
                    </div>
                    
                    <button type="submit" class="glass-button">
                        <span class="button-icon">➕</span>
                        Add to Collection
                        <span class="button-shine"></span>
                    </button>
                </form>
            </div>

            <!-- Books Collection -->
            <div class="books-section">
                <div class="section-header glass-card">
                    <h2>
                        <span class="section-icon">📚</span>
                        Your Collection
                    </h2>
                </div>

                <!-- Loading -->
                <div id="loading" class="loading glass-card">
                    <div class="loader"></div>
                    <p>Loading your books...</p>
                </div>

                <!-- Books Grid -->
                <div id="booksList" class="books-grid"></div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <span id="toast-icon" class="toast-icon"></span>
        <span id="toast-message" class="toast-message"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
